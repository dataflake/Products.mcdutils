# ---------------------------
# Build configuration
# ---------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------
# Project metadata
# ---------------------------
[project]
name = "Products.mcdutils"
dynamic = ["version"]
description = "A Zope product with memcached-backed ZCache and Zope session implementations."
readme = {file = "README.md", content-type = "text/markdown"}
authors = [
    {name = "Tres Seaver and contributors", email = "tseaver@palladion.com"},
]
maintainers = [
    {name = "Jens Vagelpohl", email = "jens@dataflake.org"}
]
keywords = ["zope", "session", "memcache", "memcached", "Products"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Zope",
    "Framework :: Zope :: 5",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Session",
]
license = "ZPL-2.1"
requires-python = ">=3.11"
dependencies = [
    "python-memcached",
    "Zope >= 5",
]

[project.urls]
Homepage = "https://mcdutils.readthedocs.io"
Documentation = "https://mcdutils.readthedocs.io"
"Issue Tracker" = "https://github.com/dataflake/Products.mcdutils/issues"
"Source Code" = "https://github.com/dataflake/Products.mcdutils"

[project.optional-dependencies]
test = [
  "pytest-cov",
  "pytest<=8.5.0",
]
docs = [
  "sphinx",
  "repoze.sphinx.autointerface",
  "sphinx-rtd-theme",
  "pkginfo",
]
# ---------------------------
# Hatch build configuration
# ---------------------------
[tool.hatch.build]
strict-naming = true

[tool.hatch.version]
path = "src/Products/mcdutils/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
  "/pyproject.toml",
  "/README.*",
  "/LICENSE*",
  "/src/**",
  "/*.md",
  "/*.rst",
  "/*.txt",
  "/*.in",
  "/*.js",
  "/*.json",
  "/*.py",
  "/docs/**",
]

exclude = [
  "resources/**",
  "tests/**",
  ".gitignore",
  ".pre-commit-config.yaml",
  ".mypy.ini",
  "instance.yaml",
  "requirements.txt",
]

[tool.hatch.build.targets.wheel]
packages = ["src/Products"]

# ---------------------------
# Manifest
# ---------------------------
[tool.check-manifest]
ignore = [
    ".flake8",
    "dependabot.yml",
    "mx.ini",
    "resources/**",
    "tests/**",
    "news/*.gitkeep",
    "news/*.internal",
    "news/*.jinja",
    "Makefile",
    ".pre-commit-config.yaml",
    ".editorconfig",
    ".meta.toml",
    "docs/_build/html/_sources/*",
    "docs/_build/html/_images/*",
    "docs/_build/html/_static/*",
    "docs/requirements.txt",
    "mypy.ini",
    ".readthedocs.yaml",
    "instance.yaml",
]


# ---------------------------
# Changelog
# ---------------------------

[tool.towncrier]
package = "Products.mcdutils"
directory = "news/"
filename = "CHANGE.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## {version} ({project_date})"
template = "news/.changelog_template.jinja"
issue_format = "[#{issue}](https://github.com/dataflake/Products.mcdutils/issues/{issue})"
underlines = ["", "", ""]

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking changes:"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "New features:"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bug fixes:"
showcontent = true

[[tool.towncrier.type]]
directory = "internal"
name = "Internal:"
showcontent = true

[[tool.towncrier.type]]
directory = "documentation"
name = "Documentation:"
showcontent = true

[[tool.towncrier.type]]
directory = "tests"
name = "Tests"
showcontent = true

# ---------------------------
# codespell
# ---------------------------
[tool.codespell]
ignore-words-list = "discreet,vew"
skip = "*.po,*"

# ---------------------------
# Ruff configuration
# ---------------------------
[tool.ruff]
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".ipynb_checkpoints",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pyenv",
  ".pytest_cache",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".vscode",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "site-packages",
  "venv",
]

line-length = 79
indent-width = 4
target-version = "py312"
fix = true

[tool.ruff.lint]
select = [
  "YTT",   # flake8-2020
  "S",     # flake8-bandit
  "B",     # flake8-bugbear
  "A",     # flake8-builtins
  "C4",    # flake8-comprehensions
  "T10",   # flake8-debugger
  "SIM",   # flake8-simplify
  "C90",   # mccabe
  "E", "W", "F", # pycodestyle + pyflakes
  "PGH",   # pygrep-hooks
  "UP",    # pyupgrade
  "I",     # isort
  "RUF",   # ruff-specific
]
ignore = ["E731"]   # allow lambda assignment
fixable = ["ALL"]
unfixable = []

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
preview = true
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.isort]
force-single-line = true
from-first = true
case-sensitive = false
lines-after-imports = 2
lines-between-types = 1
no-sections = true
order-by-type = false

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "RUF001", "S101"]


# ---------------------------
# Bandit configuration
# ---------------------------
[tool.bandit]
targets = "src"
exclude_dirs = ["tests"]

# ---------------------------
# Zest releaser configuration
# ---------------------------
[tool.zest-releaser]
upload-pypi = false
python-file-with-version = "src/Products/mcdutils/__init__.py"

# ---------------------------
# Black configuration
# ---------------------------
[tool.black]
line-length = 79          # mesmo valor do ruff
target-version = ["py312"] # igual ao ruff target-version
skip-string-normalization = false # mantém aspas duplas (como ruff)

# ---------------------------
# test
# ---------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source_pkgs = ["Products.mcdutils", "tests"]
branch = true
parallel = true

